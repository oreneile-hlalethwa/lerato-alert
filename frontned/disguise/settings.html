<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Disguise · Lerato Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .option { background: var(--card); border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 14px; border: 2px solid transparent; cursor: pointer; }
    .option:has(input:checked) { border-color: var(--coral); }
    .option input { width: 22px; height: 22px; accent-color: #C2502F; margin: 0; }
  </style>
  <script src="../assets/js/app.js"></script>
  <script>LA.guard();</script>
</head>
<body>
  <main class="app app--plain">
    <div class="topbar">
      <div class="topbar__left">
        <a class="icon-btn" href="../alert/index.html" aria-label="Back" data-icon="back"></a>
        <h1 class="title">Disguise</h1>
      </div>
    </div>
    <p class="muted" style="margin:14px 0 16px;font-size:15px">Choose what Lerato Alert looks like on your phone. Quick exit always jumps here.</p>

    <form id="form" class="stack">
      <fieldset class="stack" style="border:0;padding:0;margin:0">
        <legend class="sr-only">Disguise app</legend>
        <label class="option">
          <div class="tile" style="background:#161616;color:#E9A93A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></div>
          <div class="row__body"><div class="row__title">Calculator</div><div class="row__sub">Unlock: type your secret sum, then =</div></div>
          <input type="radio" name="type" value="calculator">
        </label>
        <label class="option">
          <div class="tile" style="background:#2F9E5B;color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></div>
          <div class="row__body"><div class="row__title">Messages</div><div class="row__sub">Unlock: send your secret word</div></div>
          <input type="radio" name="type" value="messages">
        </label>
        <label class="option">
          <div class="tile" style="background:#2F5FC4;color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></svg></div>
          <div class="row__body"><div class="row__title">Internet</div><div class="row__sub">Unlock: search your secret word</div></div>
          <input type="radio" name="type" value="browser">
        </label>
      </fieldset>

      <div class="card stack">
        <label class="field"><span id="secretLabel">Your secret sum</span>
          <input class="input" id="secret" autocomplete="off" required>
        </label>
        <p class="small muted" id="secretHint" style="margin:0"></p>
        <p class="field-error hidden" id="error" role="alert"></p>
      </div>

      <button class="btn" type="submit">Save disguise</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('form');
    const secret = document.getElementById('secret');
    const DEFAULTS = { calculator: '', messages: '', browser: '' };   // no shared defaults: each person picks their own
    const COPY = {
      calculator: ['Your secret sum', 'Like 19×58. Any other sum works like a normal calculator.'],
      messages: ['Your secret word', 'Send this word as a message to open the app.'],
      browser: ['Your secret word', 'Search this word to open the app. Anything else searches the web.'],
    };
    const current = LA.disguise();
    form.elements.type.value = current.type;
    secret.value = '';
    secret.placeholder = 'Type a new secret to change it';

    function updateCopy(type, resetValue) {
      document.getElementById('secretLabel').textContent = COPY[type][0];
      document.getElementById('secretHint').textContent = COPY[type][1];
      if (resetValue) secret.value = DEFAULTS[type];
    }
    updateCopy(current.type);
    form.querySelectorAll('input[name=type]').forEach((r) => r.addEventListener('change', () => updateCopy(r.value, true)));

    secret.required = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const type = form.elements.type.value;
      const value = secret.value.trim();
      err.classList.add('hidden');
      if (!value) {
        // Keeping the same secret only works if the kind of secret (sum vs word) hasn't changed.
        if (type !== current.type || !current.lock) {
          err.textContent = type === 'calculator' ? 'Choose a secret sum for this disguise.' : 'Choose a secret word for this disguise.';
          err.classList.remove('hidden'); return;
        }
        LA.toast('No changes');
        return;
      }
      if (type === 'calculator' && !/^\d+([,.]\d+)?\s*[+\-−×x*÷/]\s*\d+([,.]\d+)?$/.test(value)) {
        err.textContent = 'Use a simple sum like 47×12.'; err.classList.remove('hidden'); return;
      }
      if (['19×58', '19x58', '19*58', 'sunflower'].includes(value.toLowerCase())) {
        err.textContent = 'Please choose your own secret, not the example.'; err.classList.remove('hidden'); return;
      }
      if (type !== 'calculator' && !/^\S{3,}$/.test(value)) {
        err.textContent = 'Use one word with at least 3 letters.'; err.classList.remove('hidden'); return;
      }
      await LA.setSecret(type, value);
      LA.syncSettings();
      LA.toast('Disguise saved');
      setTimeout(() => location.href = '../alert/index.html', 800);
    });
  </script>
</body>
</html>
