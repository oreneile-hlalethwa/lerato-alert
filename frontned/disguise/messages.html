<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chats</title>
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chats">
  <link rel="apple-touch-icon" href="../assets/img/icon-messages-180.png">
  <link rel="icon" type="image/png" href="../assets/img/icon-messages-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #111; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .wrap { max-width: 430px; min-height: 100vh; margin: 0 auto; padding: 24px 18px 90px; }
    .top { display: flex; justify-content: space-between; align-items: center; color: #2F7D4E; font-weight: 600; }
    h1 { margin: 6px 0 12px; font-size: 32px; font-weight: 800; }
    .search { height: 40px; border-radius: 12px; background: #F0F0F0; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6B6B6B; }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; }
    .chat { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EEE; }
    .av { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    .meta { flex: 1; min-width: 0; }
    .meta div:first-child { display: flex; justify-content: space-between; font-weight: 700; }
    .meta span { font-weight: 400; font-size: 13px; color: #6B6B6B; }
    .meta div:last-child { font-size: 14px; color: #6B6B6B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    form { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 430px; padding: 10px 18px 22px; background: #fff; display: flex; gap: 8px; }
    form input { flex: 1; height: 46px; border-radius: 23px; border: 0; background: #F0F0F0; padding: 0 16px; font-size: 15px; outline: none; }
    form button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #2F7D4E; color: #fff; display: flex; align-items: center; justify-content: center; }
    .sent { text-align: center; font-size: 13px; color: #6B6B6B; padding: 8px; }
  </style>
  <script src="../assets/js/app.js"></script>
  <script>if (!LA.user()) location.replace(LA.url('index.html'));</script>
</head>
<body>
  <main class="wrap">
    <div class="top"><span>Edit</span><span aria-hidden="true">✎</span></div>
    <h1>Chats</h1>
    <label class="search"><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span><input type="search" placeholder="Search"></label>
    <div class="chat"><div class="av" style="background:#F6D9CF;color:#8A3A22">M</div><div class="meta"><div>Mom <span>18:42</span></div><div>Bring bread on your way home</div></div></div>
    <div class="chat"><div class="av" style="background:#D7E3F7;color:#2B4E8F">W</div><div class="meta"><div>Work team <span>17:05</span></div><div>Meeting moved to 9am</div></div></div>
    <div class="chat"><div class="av" style="background:#DDEFD9;color:#2F6B2A">L</div><div class="meta"><div>Lindiwe <span>Yesterday</span></div><div>Haha see you Saturday</div></div></div>
    <div class="chat"><div class="av" style="background:#EEE3F7;color:#5A3A80">C</div><div class="meta"><div>Church choir <span>Mon</span></div><div>Practice is at 4</div></div></div>
    <p id="sent" class="sent" hidden>Message sent</p>
  </main>
  <form id="form" autocomplete="off">
    <label style="flex:1;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</span><input id="msg" placeholder="Message"></label>
    <button aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg></button>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('msg');
      const word = input.value.trim().toLowerCase();
      input.value = '';
      if (!word) return;
      if (word === String(LA.disguise().secret).trim().toLowerCase()) { LA.enterApp(); return; }
      const sent = document.getElementById('sent');
      sent.hidden = false;
      setTimeout(() => { sent.hidden = true; }, 1500);
    });
  </script>
</body>
</html>
